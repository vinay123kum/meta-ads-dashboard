<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Agency Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#f6f8fb;color:#0f172a}
  .card{background:#fff;border:1px solid #eef1f6;border-radius:16px;
        box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06)}
  select{background-image:none}
  .pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}
  .up{color:#059669}.down{color:#dc2626}.flat{color:#94a3b8}
  ::-webkit-scrollbar{height:8px;width:8px}::-webkit-scrollbar-thumb{background:#dde3ec;border-radius:8px}
  .btn{font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .btn-pause{background:#fef2f2;color:#dc2626;border-color:#fecaca}
  .btn-pause:hover{background:#fee2e2}
  .btn-resume{background:#ecfdf5;color:#059669;border-color:#a7f3d0}
  .btn-resume:hover{background:#d1fae5}
  .btn-ghost{background:#f1f5f9;color:#475569}.btn-ghost:hover{background:#e2e8f0}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;
    padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
  #toast.show{opacity:1}
  .mode-safe{background:#ecfdf5;color:#059669;border:1px solid #a7f3d0}
  .mode-live{background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
</style>
</head>
<body class="min-h-screen">

<!-- top bar -->
<header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-[1240px] mx-auto px-6 h-16 flex items-center gap-4">
    <div class="flex items-center gap-2 font-bold text-slate-900">
      <span class="w-7 h-7 rounded-lg bg-blue-600 text-white grid place-items-center text-sm">A</span>
      Agency Dashboard
    </div>
    <button id="syncBtn" class="btn btn-ghost" title="Pull fresh data from Meta now">⟳ Sync now</button>
    <span id="syncInfo" class="text-xs text-slate-400"></span>
    <div class="flex-1"></div>
    <button id="salesBtn" class="text-sm px-3 py-2 rounded-lg hover:bg-slate-100" title="Sales from bookings sheet">🧾 Sales</button>
    <button id="budgetBtn" class="text-sm px-3 py-2 rounded-lg hover:bg-slate-100" title="Monthly budgets & pacing">💰 Budgets</button>
    <button id="alertBtn" class="relative text-sm px-3 py-2 rounded-lg hover:bg-slate-100" title="Alerts">
      🔔 <span id="alertCount" class="pill bg-rose-600 text-white">0</span>
    </button>
    <select id="acctSel" class="text-sm border border-slate-300 rounded-lg px-3 py-2 bg-white font-medium min-w-[220px]"></select>
    <select id="periodSel" class="text-sm border border-slate-300 rounded-lg px-3 py-2 bg-white font-medium">
      <option value="7">Last 7 days</option>
      <option value="14">Last 14 days</option>
      <option value="30">Last 30 days</option>
      <option value="custom">📅 Custom range…</option>
    </select>
    <div id="customRange" class="hidden items-center gap-1.5" title="Account metrics cover 90 days; campaign & location detail cover 30 days">
      <input id="dFrom" type="date" class="text-sm border border-slate-300 rounded-lg px-2 py-2 bg-white">
      <span class="text-slate-400">→</span>
      <input id="dTo" type="date" class="text-sm border border-slate-300 rounded-lg px-2 py-2 bg-white">
      <button id="applyRange" class="text-sm bg-blue-600 text-white rounded-lg px-3 py-2 font-medium hover:bg-blue-700">Apply</button>
    </div>
    <button id="modeBtn" class="text-xs font-semibold px-3 py-2 rounded-lg mode-safe" title="Toggle whether actions actually change live ads">🟢 Safe</button>
    <button id="refresh" class="text-sm text-slate-500 hover:text-slate-800" title="Reload">⟳</button>
  </div>
</header>
<div id="toast"></div>

<main class="max-w-[1240px] mx-auto px-6 py-6">
  <div id="view"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const money = n => '$'+(n||0).toLocaleString(undefined,{maximumFractionDigits:n<100?2:0});
const num = n => (n||0).toLocaleString(undefined,{maximumFractionDigits:n<100?1:0});
const STATUS_CLS = {ACTIVE:'bg-emerald-50 text-emerald-700',CLOSED:'bg-rose-50 text-rose-700',
  DISABLED:'bg-rose-50 text-rose-700',UNSETTLED:'bg-amber-50 text-amber-700',
  PENDING_RISK_REVIEW:'bg-amber-50 text-amber-700',IN_GRACE_PERIOD:'bg-amber-50 text-amber-700'};
const healthColor = s => s>=80?'#059669':s>=65?'#2563eb':s>=45?'#d97706':'#dc2626';

let ACCOUNTS = [];
let MODE_SAFE = true;   // mirrors server Safe/Live mode
let CUR = null;         // current account detail payload

/* ---------- mode + actions ---------- */
async function loadMode(){
  const m = await (await fetch('/api/mode')).json();
  MODE_SAFE = m.safe; paintMode();
}
function paintMode(){
  const b = $('#modeBtn');
  b.textContent = MODE_SAFE ? '🟢 Safe' : '🔴 LIVE';
  b.className = 'text-xs font-semibold px-3 py-2 rounded-lg ' + (MODE_SAFE?'mode-safe':'mode-live');
}
async function toggleMode(){
  const next = !MODE_SAFE;
  if(!next && !confirm('Switch to LIVE mode?\n\nActions will make REAL changes to live ad accounts.')) return;
  const m = await (await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({safe:next})})).json();
  MODE_SAFE = m.safe; paintMode();
  toast(MODE_SAFE?'Safe mode — actions are dry-run':'LIVE mode — actions hit real ads');
}
let toastT;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600);
}
async function doAction(payload, label){
  const note = MODE_SAFE ? '\n\n[SAFE mode — dry-run, will NOT change live ads]'
                         : '\n\n[LIVE mode — will change REAL ads]';
  if(!confirm(label+note+'\n\nProceed?')) return;
  const r = await (await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)})).json();
  toast(r.status==='failed' ? ('Failed: '+r.detail)
        : r.status==='dryrun' ? 'Logged (dry-run)' : 'Applied ✓');
  render();
}
function toggleCampaign(id){
  const c = CUR.campaigns.find(x=>x.id===id); if(!c) return;
  const action = c.status==='ACTIVE' ? 'pause':'resume';
  doAction({account_id:CUR.account.id, account_name:CUR.account.name, level:'campaign',
    object_id:id, object_name:c.name, action, before:c.status},
    `${action==='pause'?'Pause':'Resume'} campaign "${c.name}"`);
}
function editBudget(id){
  const c = CUR.campaigns.find(x=>x.id===id); if(!c) return;
  const v = prompt(`New DAILY budget (USD) for "${c.name}":`, c.daily_budget);
  if(v===null) return;
  const val = parseFloat(v); if(isNaN(val)||val<=0){toast('Invalid amount');return;}
  doAction({account_id:CUR.account.id, account_name:CUR.account.name, level:'campaign',
    object_id:id, object_name:c.name, action:'set_budget', value:val, before:c.daily_budget},
    `Set "${c.name}" daily budget to $${val}`);
}
function pauseAd(adId){
  const i = CUR.fatigue.items.find(x=>x.ad_id===adId); const nm = i?i.name:adId;
  doAction({account_id:CUR.account.id, account_name:CUR.account.name, level:'ad',
    object_id:adId, object_name:nm, action:'pause', before:'ACTIVE'},
    `Pause creative "${nm}"`);
}
async function undoAction(logId){
  const r = await (await fetch(`/api/action/${logId}/undo`,{method:'POST'})).json();
  toast(r.status==='failed'?('Undo failed: '+r.detail):'Reverted ✓'); render();
}
async function renderActionLog(accountId){
  const rows = await (await fetch(`/api/actions?account_id=${accountId}&limit=12`)).json();
  const el = $('#actionLog'); if(!el) return;
  if(!rows.length){ el.innerHTML=''; return; }
  const badge = s => s==='success'?'bg-emerald-50 text-emerald-700'
    :s==='dryrun'?'bg-slate-100 text-slate-500':'bg-rose-50 text-rose-700';
  el.innerHTML = `<div class="card p-5 mt-4">
    <h2 class="text-sm font-semibold text-slate-500 mb-3">Action log</h2>
    <table class="w-full text-sm"><tbody>${rows.map(r=>`
      <tr class="border-b border-slate-50">
        <td class="py-1.5 text-slate-400 text-xs whitespace-nowrap">${r.ts.slice(5,16).replace('T',' ')}</td>
        <td class="font-medium">${r.action} <span class="text-slate-400">${r.object_name||''}</span></td>
        <td class="text-slate-400 text-xs">${r.before_state}→${r.after_state}</td>
        <td><span class="pill ${badge(r.status)}">${r.status}</span></td>
        <td class="text-right">${(r.action==='pause'||r.action==='resume'||r.action==='set_budget')?
          `<button class="btn btn-ghost" onclick="undoAction(${r.id})">undo</button>`:''}</td>
      </tr>`).join('')}</tbody></table></div>`;
}

/* ---------- sync + alerts ---------- */
function ago(iso){
  if(!iso) return 'never';
  const s=(Date.now()-new Date(iso).getTime())/1000;
  if(s<90) return 'just now';
  if(s<5400) return Math.round(s/60)+'m ago';
  if(s<172800) return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';
}
async function loadSyncInfo(){
  const s = await (await fetch('/api/sync/status')).json();
  $('#syncInfo').textContent = s.running ? 'syncing…' : 'synced '+ago(s.last_sync);
  $('#syncBtn').disabled = s.running;
  return s;
}
async function syncNow(){
  const r = await (await fetch('/api/sync',{method:'POST'})).json();
  if(!r.started){ toast('Sync already running'); return; }
  toast('Sync started — pulling from Meta…');
  const t=setInterval(async()=>{
    const s=await loadSyncInfo();
    if(!s.running){ clearInterval(t); toast('Sync complete ✓'); loadAlerts(); render(); }
  },4000);
}
async function loadAlerts(){
  const rows = await (await fetch('/api/alerts?status=open')).json();
  window.ALERTS = rows;
  const n = rows.length, b=$('#alertCount');
  b.textContent = n; b.style.display = n? '' : 'none';
  return rows;
}
function renderAlerts(){
  const rows = window.ALERTS||[];
  const sev = s => s==='critical'?'border-rose-400 bg-rose-50':s==='warn'?'border-amber-400 bg-amber-50':'border-blue-300 bg-blue-50';
  const groups = {critical:[],warn:[],info:[]};
  rows.forEach(r=>(groups[r.severity]||groups.info).push(r));
  const block = (title,arr)=> arr.length? `<h2 class="text-sm font-semibold text-slate-500 mt-4 mb-2">${title} (${arr.length})</h2>`+
    arr.map(r=>`<div class="flex items-center gap-3 border-l-4 ${sev(r.severity)} rounded-r-lg px-3 py-2 mb-2">
      <div class="flex-1"><b class="text-sm">${r.account_name}</b> <span class="text-slate-600 text-sm">— ${r.message}</span>
        <span class="text-slate-400 text-xs ml-2">${ago(r.updated_at)}</span></div>
      <button class="btn btn-ghost" onclick="ackAlert(${r.id},'ack')">Ack</button>
      <button class="btn btn-ghost" onclick="ackAlert(${r.id},'resolved')">Resolve</button>
    </div>`).join('') : '';
  $('#view').innerHTML = `<div class="flex items-end justify-between mb-2">
      <div><h1 class="text-xl font-bold">Alerts</h1>
      <p class="text-slate-500 text-sm">${rows.length} open across all accounts</p></div>
      <button class="btn btn-ghost" onclick="goPortfolio()">← Portfolio</button></div>
    ${rows.length? block('🔴 Critical',groups.critical)+block('🟠 Warning',groups.warn)+block('🔵 Info',groups.info)
      : '<div class="card p-8 text-center text-slate-400">No open alerts 🎉</div>'}`;
}
async function ackAlert(id,status){
  await fetch(`/api/alerts/${id}/${status}`,{method:'POST'});
  await loadAlerts(); renderAlerts();
}
function goPortfolio(){ $('#acctSel').value='__portfolio__'; render(); }

/* ---------- budgets ---------- */
function paceBar(pct, danger){
  const c = pct>=100?'#dc2626':pct>=80?'#d97706':pct>=60?'#eab308':'#059669';
  return `<div class="h-2 rounded-full bg-slate-100 w-full"><div class="h-2 rounded-full" style="width:${Math.min(100,pct)}%;background:${c}"></div></div>`;
}
async function renderBudgets(){
  const rows = await (await fetch('/api/budgets')).json();
  const body = rows.map(r=>{
    const p = r.pacing;
    const pct = p?p.pct:0;
    const status = !p ? '<span class="text-slate-400 text-xs">set a budget →</span>'
      : !p.will_last ? `<span class="pill bg-amber-50 text-amber-700">runs out ~${p.runout_date}</span>`
      : pct>=100 ? '<span class="pill bg-rose-50 text-rose-700">overspent</span>'
      : `<span class="pill bg-emerald-50 text-emerald-700">on track</span>`;
    return `<tr class="border-b border-slate-50">
      <td class="py-2 pr-3 font-medium">${r.name}</td>
      <td class="text-right">$<input type="number" value="${r.monthly_budget||''}" placeholder="0"
          class="w-24 border border-slate-300 rounded px-2 py-1 text-right text-sm"
          onchange="saveBudget('${r.id}', this.value)"></td>
      <td class="text-right tabular-nums">${p?money(p.mtd_spend):'—'}</td>
      <td class="w-48">${p?`<div class="flex items-center gap-2">${paceBar(pct)}<span class="text-xs tabular-nums w-10">${pct}%</span></div>`:''}</td>
      <td class="text-right tabular-nums">${p?money(p.projected):'—'}</td>
      <td class="text-right tabular-nums">${p&&p.runway_days!=null?p.runway_days+'d':'—'}</td>
      <td>${status}</td>
    </tr>`;}).join('');
  $('#view').innerHTML = `<div class="flex items-end justify-between mb-3">
      <div><h1 class="text-xl font-bold">Monthly budgets & pacing</h1>
      <p class="text-slate-500 text-sm">Meta+Instagram budgets — auto-synced from the media-plan sheet. Verify & edit inline; pacing and alerts update automatically.</p></div>
      <div class="flex gap-2">
        <button id="budImportBtn" class="btn btn-ghost" onclick="syncBudgetsFromSheet()">⟳ Sync from sheet</button>
        <button class="btn btn-ghost" onclick="goPortfolio()">← Portfolio</button>
      </div></div>
    <div class="card p-5 overflow-x-auto"><table class="w-full text-sm">
      <thead class="text-xs text-slate-400 text-left"><tr>
        <th class="py-1">Account</th><th class="text-right">Monthly budget</th><th class="text-right">Spent (MTD)</th>
        <th>Pace</th><th class="text-right">Projected</th><th class="text-right">Runway</th><th>Status</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}
async function saveBudget(id, val){
  const v = parseFloat(val); if(isNaN(v)||v<0){toast('Invalid amount');return;}
  await fetch('/api/budgets',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({account_id:id, monthly_budget:v})});
  toast('Budget saved ✓'); renderBudgets(); loadAlerts();
}
async function syncBudgetsFromSheet(){
  const b=$('#budImportBtn'); if(b){b.disabled=true;b.textContent='Syncing…';}
  const r = await (await fetch('/api/budgets/sync',{method:'POST'})).json();
  if(r.ok){ toast(`Imported ${r.applied} budgets ✓ — verify below`); }
  else { toast('Sheet sync failed'); alert('Budget sheet sync could not run:\n\n'+(r.reason||'unknown')+'\n\nExisting budgets are unchanged.'); }
  renderBudgets(); loadAlerts();
}
async function saveExpected(id, val){
  await fetch('/api/guard/expected',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({account_id:id, expected_url:val})});
  toast('Guard updated ✓'); render(); loadAlerts();
}

/* ---------- sales ---------- */
async function renderSales(){
  $('#view').innerHTML = `<div class="text-slate-400 text-sm py-20 text-center">Loading sales…</div>`;
  const d = await (await fetch('/api/sales')).json();
  const s = d.stats||{};
  const rows = d.locations.map(l=>`<tr class="border-b border-slate-50">
    <td class="py-2 pr-3 font-medium">${l.location}</td>
    <td class="text-right tabular-nums font-semibold">${num(l.sales)}</td>
    <td class="text-slate-400 text-xs">${l.first||''} → ${l.last||''}</td>
  </tr>`).join('') || `<tr><td colspan="3" class="text-slate-400 py-4 text-sm">No sales yet — click Sync sheet.</td></tr>`;
  $('#view').innerHTML = `
    <div class="flex items-end justify-between mb-3">
      <div><h1 class="text-xl font-bold">Sales</h1>
      <p class="text-slate-500 text-sm">From the bookings sheet · deduplicated · synced ${d.last_sync?ago(d.last_sync):'never'}</p></div>
      <div class="flex gap-2">
        <button id="salesSyncBtn" class="btn btn-ghost" onclick="syncSales()">⟳ Sync sheet</button>
        <button class="btn btn-ghost" onclick="goPortfolio()">← Portfolio</button>
      </div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
      <div class="card p-4"><div class="text-2xl font-bold">${num(d.total)}</div><div class="text-xs text-slate-400 uppercase">Total sales</div></div>
      <div class="card p-4"><div class="text-2xl font-bold">${d.locations.length}</div><div class="text-xs text-slate-400 uppercase">Locations</div></div>
      <div class="card p-4"><div class="text-2xl font-bold">${num(d.attributed)}</div><div class="text-xs text-slate-400 uppercase">UTM-attributed</div></div>
      <div class="card p-4"><div class="text-2xl font-bold text-slate-400">${num((s.dup||0)+(s.junk||0))}</div><div class="text-xs text-slate-400 uppercase">Junk+dupes removed</div></div>
    </div>
    <div class="card p-5 overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="text-xs text-slate-400 text-left"><tr><th class="py-1">Location</th><th class="text-right">Unique sales</th><th>Date range</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="text-xs text-slate-400 mt-3">🔒 Privacy: only counts + a one-way hash are stored — no names, emails, or phone numbers are saved in the dashboard.</p>`;
}
async function syncSales(){
  const b=$('#salesSyncBtn'); if(b){b.disabled=true;b.textContent='Syncing…';}
  const r = await (await fetch('/api/sales/sync',{method:'POST'})).json();
  if(r.ok){ toast(`Synced ✓ (${r.new} new)`); }
  else { toast('Sync failed'); alert('Sheet sync could not run:\n\n'+(r.reason||'unknown')); }
  renderSales();
}

async function boot(){
  ACCOUNTS = await (await fetch('/api/accounts')).json();
  const sel = $('#acctSel');
  sel.innerHTML = '<option value="__portfolio__">📊 Portfolio overview</option>' +
    ACCOUNTS.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');

  // set calendar bounds to available data (account metrics = 90d)
  const m = await (await fetch('/api/meta')).json();
  if(m.max_date){
    for(const el of [$('#dFrom'),$('#dTo')]){ el.min=m.min_date; el.max=m.max_date; }
    $('#dTo').value = m.max_date;
    const f = new Date(m.max_date); f.setDate(f.getDate()-6);
    $('#dFrom').value = f.toISOString().slice(0,10);
  }

  await loadMode();
  await loadSyncInfo();
  await loadAlerts();
  $('#modeBtn').onclick = toggleMode;
  $('#syncBtn').onclick = syncNow;
  $('#alertBtn').onclick = renderAlerts;
  $('#budgetBtn').onclick = renderBudgets;
  $('#salesBtn').onclick = renderSales;
  sel.onchange = render;
  $('#periodSel').onchange = onPeriodChange;
  $('#applyRange').onclick = render;
  $('#refresh').onclick = render;
  render();
}

function onPeriodChange(){
  const custom = $('#periodSel').value==='custom';
  $('#customRange').classList.toggle('hidden', !custom);
  $('#customRange').classList.toggle('flex', custom);
  if(!custom) render();          // presets render immediately; custom waits for Apply
}

function currentQuery(){
  const p = $('#periodSel').value;
  if(p==='custom'){
    const s=$('#dFrom').value, e=$('#dTo').value;
    if(s && e) return s<=e ? `start=${s}&end=${e}` : `start=${e}&end=${s}`;
    return 'period=7';
  }
  return `period=${p}`;
}

function render(){
  const id = $('#acctSel').value;
  if(id==='__portfolio__') return renderPortfolio();
  return renderAccount(id, currentQuery());
}

/* ---------- PORTFOLIO ---------- */
function renderPortfolio(){
  const cards = ACCOUNTS.map(a=>`
    <div onclick="selectAccount('${a.id}')" class="card p-4 cursor-pointer hover:shadow-md transition">
      <div class="flex items-center gap-3">
        <span class="w-9 h-9 rounded-lg grid place-items-center text-white text-sm font-semibold"
              style="background:${a.color}">${a.initials}</span>
        <div class="min-w-0 flex-1">
          <div class="font-semibold text-sm truncate">${a.name}</div>
          <span class="pill ${STATUS_CLS[a.status]||'bg-slate-100 text-slate-600'}">${a.status}</span>
        </div>
        <div class="text-right">
          <div class="text-lg font-bold" style="color:${healthColor(a.health)}">${a.health}</div>
          <div class="text-[10px] text-slate-400 uppercase">health</div>
        </div>
      </div>
      <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-100 text-sm">
        <div><span class="text-slate-400 text-xs">30d spend</span><br><b>${money(a.spend30)}</b></div>
        <div class="flex gap-1.5">
          ${a.fatigue_high?`<span class="pill bg-rose-50 text-rose-700" title="fatiguing creatives">🔥 ${a.fatigue_high}</span>`:''}
          ${(a.issues-a.fatigue_high)>0?`<span class="pill bg-amber-50 text-amber-700">⚠ ${a.issues-a.fatigue_high}</span>`
            :(!a.fatigue_high?`<span class="pill bg-emerald-50 text-emerald-700">✓ healthy</span>`:'')}
        </div>
      </div>
    </div>`).join('');
  const totalSpend = ACCOUNTS.reduce((s,a)=>s+a.spend30,0);
  const issues = ACCOUNTS.reduce((s,a)=>s+a.issues,0);
  $('#view').innerHTML = `
    <div class="flex items-end justify-between mb-5">
      <div><h1 class="text-xl font-bold">Portfolio overview</h1>
      <p class="text-slate-500 text-sm">${ACCOUNTS.length} accounts · ${money(totalSpend)} spend (30d) · ${issues} flagged issues</p></div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">${cards}</div>`;
}
function selectAccount(id){ $('#acctSel').value=id; render(); }

/* ---------- ACCOUNT DETAIL ---------- */
async function renderAccount(id, query){
  $('#view').innerHTML = `<div class="text-slate-400 text-sm py-20 text-center">Loading…</div>`;
  const d = await (await fetch(`/api/account/${id}?${query}`)).json();
  CUR = d;
  const a = d.account, h = d.health;

  const kpis = d.kpis.map(k=>{
    let v = k.unit==='$'?money(k.value):k.unit==='%'?num(k.value)+'%':num(k.value);
    let delta = '';
    if(k.delta!==null){
      const good = (k.delta>0)===k.up_good;
      const cls = k.delta===0?'flat':good?'up':'down';
      const arrow = k.delta>0?'▲':k.delta<0?'▼':'■';
      delta = `<span class="${cls} text-xs font-semibold">${arrow} ${Math.abs(k.delta)}%</span>`;
    }
    return `<div class="card p-4">
      <div class="text-[11px] uppercase tracking-wide text-slate-400 mb-1">${k.label}</div>
      <div class="flex items-end justify-between"><div class="text-xl font-bold">${v}</div>${delta}</div>
    </div>`;
  }).join('');

  // ---- budget pacing card ----
  const p = d.pacing;
  const pacingHtml = p ? `<div class="card p-5 mb-5">
    <div class="flex items-center gap-3 mb-3">
      <h2 class="text-sm font-semibold text-slate-700">💰 Budget pacing <span class="text-slate-400 font-normal">· ${p.days_elapsed}/${p.days_in_month} days</span></h2>
      ${!p.will_last?`<span class="pill bg-amber-50 text-amber-700 ml-auto">runs out ~${p.runout_date}</span>`
        :p.pct>=100?`<span class="pill bg-rose-50 text-rose-700 ml-auto">overspent</span>`
        :`<span class="pill bg-emerald-50 text-emerald-700 ml-auto">on track</span>`}
    </div>
    <div class="flex items-center gap-3 mb-3">${paceBar(p.pct)}<span class="text-sm font-semibold tabular-nums w-12">${p.pct}%</span></div>
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3 text-sm">
      <div><div class="text-slate-400 text-xs">Monthly budget</div><b>${money(p.monthly_budget)}</b></div>
      <div><div class="text-slate-400 text-xs">Spent (MTD)</div><b>${money(p.mtd_spend)}</b></div>
      <div><div class="text-slate-400 text-xs">Avg / day</div><b>${money(p.avg_daily)}</b></div>
      <div><div class="text-slate-400 text-xs">Projected month-end</div><b class="${p.projected>p.monthly_budget?'down':''}">${money(p.projected)}</b></div>
      <div><div class="text-slate-400 text-xs">Runway</div><b>${p.runway_days!=null?p.runway_days+' days':'—'}</b> <span class="text-slate-400 text-xs">/ ${p.days_remaining} left</span></div>
    </div></div>`
    : `<div class="card p-4 mb-5 text-sm text-slate-400">No monthly budget set — <button class="text-blue-600 font-medium" onclick="renderBudgets()">set one</button> to track pacing & runway.</div>`;

  const subBars = Object.entries(h.sub).map(([k,v])=>`
    <div class="mb-2.5">
      <div class="flex justify-between text-xs mb-1"><span class="text-slate-500">${k}</span><b>${v}</b></div>
      <div class="h-1.5 rounded-full bg-slate-100"><div class="h-1.5 rounded-full" style="width:${v}%;background:${healthColor(v)}"></div></div>
    </div>`).join('');

  const lists = (arr,good)=>arr.map(t=>`<li class="flex gap-2 text-sm py-1">
      <span>${good?'✅':'⚠️'}</span><span class="text-slate-700">${t}</span></li>`).join('');

  const recs = d.recommendations.length? d.recommendations.map(r=>{
    const pc = {HIGH:'bg-rose-50 text-rose-700',MED:'bg-amber-50 text-amber-700',LOW:'bg-slate-100 text-slate-600'}[r.priority];
    return `<div class="border border-slate-100 rounded-xl p-3.5 mb-2.5 hover:border-slate-200">
      <div class="flex items-center gap-2 mb-1">
        <span class="pill ${pc}">${r.priority}</span>
        <b class="text-sm">${r.title}</b>
        <span class="ml-auto text-xs text-blue-600 font-medium">${r.impact}</span>
      </div>
      <p class="text-sm text-slate-500">${r.detail}</p>
    </div>`;}).join('') : `<p class="text-slate-400 text-sm">No actions needed — account looks healthy.</p>`;

  // ---- creative fatigue ----
  const ftrend=(v,goodUp)=>{ if(v===null||v===undefined) return '<span class="flat text-xs">—</span>';
    const good=(v>0)===goodUp, cls=v===0?'flat':good?'up':'down', ar=v>0?'▲':v<0?'▼':'■';
    return `<span class="${cls} text-xs">${ar}${Math.abs(v)}%</span>`; };
  const RISK={HIGH:'bg-rose-50 text-rose-700',MEDIUM:'bg-amber-50 text-amber-700',LOW:'bg-slate-100 text-slate-500'};
  const f=d.fatigue, flag=f.items.filter(i=>i.risk!=='LOW');
  const frows = flag.map(i=>`<tr class="border-b border-slate-50">
    <td class="py-2 pr-3 font-medium">${i.is_video?'🎬':'🖼️'} ${i.name.length>42?i.name.slice(0,42)+'…':i.name}</td>
    <td class="text-right tabular-nums">${i.is_video?i.hook_rate+'%':'—'} ${i.is_video?ftrend(i.hook_trend,true):''}</td>
    <td class="text-right tabular-nums">${i.ctr}% ${ftrend(i.ctr_trend,true)}</td>
    <td class="text-right tabular-nums">${i.frequency}</td>
    <td class="text-right tabular-nums">$${i.cpm} ${ftrend(i.cpm_trend,false)}</td>
    <td><span class="pill ${RISK[i.risk]}">${i.risk}</span></td>
    <td class="text-slate-500 text-xs">${i.reasons.slice(0,2).join(', ')||i.action}</td>
    <td class="text-right"><button class="btn btn-pause" onclick="pauseAd('${i.ad_id}')">Pause</button></td>
  </tr>`).join('');
  const fatHtml = `<div class="card p-5 mb-5">
    <div class="flex items-center gap-3 mb-3">
      <h2 class="text-sm font-semibold text-slate-700">🔥 Creative fatigue <span class="text-slate-400 font-normal">· rolling 14d</span></h2>
      <div class="flex gap-1.5 ml-auto text-xs">
        <span class="pill bg-rose-50 text-rose-700">${f.summary.high} high</span>
        <span class="pill bg-amber-50 text-amber-700">${f.summary.med} med</span>
        <span class="pill bg-slate-100 text-slate-500">${f.summary.low} stable</span>
      </div>
    </div>
    ${flag.length?`<div class="overflow-x-auto"><table class="w-full text-sm">
      <thead class="text-xs text-slate-400 text-left"><tr>
        <th class="py-1">Creative</th><th class="text-right">Hook</th><th class="text-right">CTR</th>
        <th class="text-right">Freq</th><th class="text-right">CPM</th><th>Risk</th><th>Why</th><th class="text-right">Act</th></tr></thead>
      <tbody>${frows}</tbody></table></div>`
      :`<p class="text-slate-400 text-sm">No fatiguing creatives — all active creatives stable, or none meet the spend/data threshold (≥$100, ≥7 days).</p>`}
  </div>`;

  // ---- guardrails card ----
  const G = d.guard || {mismatches:[],ai_adset_names:[]};
  const guardHtml = `<div class="card p-5 mb-5">
    <h2 class="text-sm font-semibold text-slate-700 mb-3">🛡️ Guardrails</h2>
    <div class="grid md:grid-cols-2 gap-6">
      <div>
        <div class="text-xs uppercase tracking-wide text-slate-400 mb-2">Landing-page guard</div>
        <div class="text-sm mb-2">Expected:
          <input value="${G.override||''}" placeholder="${G.dominant||'—'}"
            class="border border-slate-300 rounded px-2 py-1 text-sm w-52"
            onchange="saveExpected('${a.id}', this.value)">
          <div class="text-slate-400 text-xs mt-1">blank = auto-learned from ads (${G.dominant||'n/a'})</div></div>
        ${G.mismatches.length
          ? `<div class="text-sm text-amber-700 font-medium mb-1">⚠ ${G.mismatches.length} active ad(s) off pattern:</div>`+
            G.mismatches.slice(0,6).map(m=>`<div class="text-xs text-slate-600 mb-0.5">• ${m.name} → <span class="text-rose-600">${m.pattern}</span></div>`).join('')
          : `<div class="text-sm text-emerald-700">✓ All active ads match the account's landing-page pattern</div>`}
      </div>
      <div>
        <div class="text-xs uppercase tracking-wide text-slate-400 mb-2">AI targeting</div>
        ${G.ai_adsets
          ? `<div class="text-sm text-amber-700 font-medium mb-1">⚠ Advantage+ Audience ON — ${G.ai_adsets} active ad set(s)</div>`+
            G.ai_adset_names.map(n=>`<div class="text-xs text-slate-600 mb-0.5">• ${n}</div>`).join('')
          : `<div class="text-sm text-emerald-700">✓ No Advantage+ Audience on active ad sets</div>`}
        ${G.advantage_shopping?`<div class="text-sm text-blue-700 mt-2">🛍️ ${G.advantage_shopping} Advantage+ shopping campaign(s) active</div>`:''}
      </div>
    </div>
  </div>`;

  const camps = d.campaigns.map(c=>`<tr class="border-b border-slate-50">
    <td class="py-2 pr-3 font-medium">${c.name}</td>
    <td><span class="pill ${c.status==='ACTIVE'?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate-500'}">${c.status}</span></td>
    <td class="text-right tabular-nums">${money(c.spend)}</td>
    <td class="text-right tabular-nums">${num(c.impressions)}</td>
    <td class="text-right tabular-nums">${num(c.ctr)}%</td>
    <td class="text-right tabular-nums">${num(c.conversions)}</td>
    <td class="text-right tabular-nums">${c.cpa?money(c.cpa):'—'}</td>
    <td class="text-center">${c.spend>=15&&c.conversions===0?'⚠️':c.conversions>=3&&c.ctr>=2?'⭐':''}</td>
    <td class="text-right whitespace-nowrap">
      <button class="btn ${c.status==='ACTIVE'?'btn-pause':'btn-resume'}" onclick="toggleCampaign('${c.id}')">${c.status==='ACTIVE'?'Pause':'Resume'}</button>
      ${c.daily_budget>0?`<button class="btn btn-ghost" onclick="editBudget('${c.id}')" title="Edit daily budget">$${num(c.daily_budget)}✎</button>`:''}
    </td>
  </tr>`).join('') || `<tr><td colspan="9" class="text-slate-400 py-4 text-sm">No campaign delivery in this period.</td></tr>`;

  const geo = d.geo.map(g=>`<tr class="border-b border-slate-50">
    <td class="py-1.5">${g.country}</td>
    <td class="text-right tabular-nums">${money(g.spend)}</td>
    <td class="text-right tabular-nums">${num(g.conversions)}</td></tr>`).join('')
    || `<tr><td colspan="3" class="text-slate-400 py-3 text-sm">No location data.</td></tr>`;

  $('#view').innerHTML = `
    <!-- header -->
    <div class="card p-5 mb-5 flex items-center gap-4">
      <span class="w-12 h-12 rounded-xl grid place-items-center text-white text-lg font-bold" style="background:${a.color}">${a.initials}</span>
      <div>
        <h1 class="text-xl font-bold">${a.name}</h1>
        <div class="flex items-center gap-2 mt-1">
          <span class="pill ${STATUS_CLS[a.status]||'bg-slate-100 text-slate-600'}">${a.status}</span>
          <span class="text-slate-400 text-sm">${a.currency} · ${d.window_label} · ${d.days} days</span>
        </div>
      </div>
      <div class="ml-auto text-right">
        <div class="text-3xl font-bold" style="color:${healthColor(h.score)}">${h.score}<span class="text-base text-slate-400">/100</span></div>
        <div class="text-xs font-semibold tracking-wide" style="color:${healthColor(h.score)}">${h.label}</div>
      </div>
    </div>

    <!-- KPIs -->
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-5">${kpis}</div>

    ${pacingHtml}

    <!-- trend + health -->
    <div class="grid lg:grid-cols-3 gap-4 mb-5">
      <div class="card p-5 lg:col-span-2">
        <h2 class="text-sm font-semibold text-slate-500 mb-3">Spend vs Conversions</h2>
        <div id="trend"></div>
      </div>
      <div class="card p-5">
        <h2 class="text-sm font-semibold text-slate-500 mb-3">Health breakdown</h2>
        ${subBars}
      </div>
    </div>

    <!-- working / not working -->
    <div class="grid md:grid-cols-2 gap-4 mb-5">
      <div class="card p-5"><h2 class="text-sm font-semibold text-emerald-700 mb-2">What's working</h2><ul>${lists(d.working,true)}</ul></div>
      <div class="card p-5"><h2 class="text-sm font-semibold text-amber-700 mb-2">What's not working</h2><ul>${lists(d.not_working,false)}</ul></div>
    </div>

    <!-- recommendations -->
    <div class="card p-5 mb-5">
      <h2 class="text-sm font-semibold text-slate-700 mb-3">🎯 Recommendations</h2>${recs}
    </div>

    ${fatHtml}

    ${guardHtml}

    <!-- campaigns + geo -->
    <div class="grid lg:grid-cols-3 gap-4">
      <div class="card p-5 lg:col-span-2 overflow-x-auto">
        <h2 class="text-sm font-semibold text-slate-500 mb-3">Campaigns</h2>
        <table class="w-full text-sm">
          <thead class="text-xs text-slate-400 text-left">
            <tr><th class="py-1">Campaign</th><th>Status</th><th class="text-right">Spend</th>
            <th class="text-right">Impr</th><th class="text-right">CTR</th><th class="text-right">Conv</th>
            <th class="text-right">CPA</th><th class="text-center">Flag</th><th class="text-right">Action</th></tr>
          </thead><tbody>${camps}</tbody>
        </table>
      </div>
      <div class="card p-5">
        <h2 class="text-sm font-semibold text-slate-500 mb-3">Top locations</h2>
        <table class="w-full text-sm">
          <thead class="text-xs text-slate-400 text-left"><tr><th>Country</th><th class="text-right">Spend</th><th class="text-right">Conv</th></tr></thead>
          <tbody>${geo}</tbody>
        </table>
      </div>
    </div>
    <div id="actionLog"></div>`;

  drawTrend(d.trend);
  renderActionLog(id);
}

function drawTrend(trend){
  new ApexCharts($('#trend'),{
    chart:{height:260,type:'line',toolbar:{show:false},fontFamily:'Inter'},
    series:[{name:'Spend',type:'column',data:trend.map(t=>t.spend)},
            {name:'Conversions',type:'line',data:trend.map(t=>t.conv)}],
    stroke:{width:[0,3],curve:'smooth'},
    colors:['#bfdbfe','#2563eb'],
    plotOptions:{bar:{borderRadius:4,columnWidth:'55%'}},
    xaxis:{categories:trend.map(t=>t.date.slice(5)),labels:{style:{colors:'#94a3b8'}}},
    yaxis:[{labels:{formatter:v=>'$'+v.toFixed(0),style:{colors:'#94a3b8'}}},
           {opposite:true,labels:{formatter:v=>v.toFixed(0),style:{colors:'#94a3b8'}}}],
    grid:{borderColor:'#f1f5f9'},legend:{show:true,position:'top',horizontalAlign:'right'},
    dataLabels:{enabled:false}
  }).render();
}
boot();
</script>
</body>
</html>
